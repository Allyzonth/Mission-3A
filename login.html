<!doctype html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Masuk | videobelajar</title>
	<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
	<main class="auth-shell">
		<a class="logo auth-brand" href="index.html">
			<span class="logo-mark">▶</span>videobelajar
		</a>
		<h1>Selamat datang kembali</h1>
		<p class="auth-intro">Masuk untuk melanjutkan perjalanan belajarmu.</p>
		<form action="index.html">
			<div class="form-group">
				<label for="login-email">Email</label>
				<input id="login-email" name="email" type="email" placeholder="nama@email.com" required>
			</div>
			<div class="form-group">
				<label for="login-password">Password</label>
				<input id="login-password" name="password" type="password" placeholder="Masukkan password" required>
			</div>
			<div class="form-row">
				<span></span>
				<a class="text-link accent" href="#">Lupa Password?</a>
			</div>
			<button class="btn btn-primary btn-full" type="submit">Masuk</button>
		</form>
		<div class="auth-divider">atau</div>
		<a class="btn btn-ghost btn-full" href="index.html">
			<span class="google-mark">G</span> Masuk dengan Google
		</a>
		<p class="auth-switch">Belum punya akun? <a class="text-link accent" href="register.html">Daftar sekarang</a></p>
	</main>
</body>
</html>
